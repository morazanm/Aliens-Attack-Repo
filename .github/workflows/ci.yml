name: Build and Test Aliens Attack Teachpack
on: 
# Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    name: Build and Run Tests on Stable Racket Release
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout 
        uses: actions/checkout@main

      - name: Install Racket and Raco 
        uses: Bogdanp/setup-racket@v1.16 # see https://github.com/Bogdanp/setup-racket for more info
        with:
          architecture: 'x64'
          distribution: 'full' # or: 'minimal'
          variant: 'CS' 
          version: 'stable' 
      # Build APS-Aliens-Attack
      - name: Build Aliens Attack teachpack
        run: raco pkg install 
      # Kick off the tests
      - name: Run tests
        run: raco test --quiet -t AliensAttack-test 
      # Thank you Andres for the outline
